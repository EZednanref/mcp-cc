[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-codecarbon"
version = "0.1.0"
description = "MCP server for CodeCarbon energy tracking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Enzo Fernandez"}
]
keywords = ["mcp", "codecarbon", "energy", "tracking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "mcp>=0.9.0",
    "codecarbon>=2.3.0",
]

[project.scripts]
mcp-codecarbon = "mcp_codecarbon.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mcp_codecarbon*"]

[tool.setuptools.package-dir]
"" = "src"
